<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DoyaLabs 01 Cover</title>
<script>if (location.hash === "#portrait") document.documentElement.classList.add("portrait");</script>
<link rel="stylesheet" href="slides.css">
<style>
  .hero { margin-top: auto; }
  .intro { font-size: 60px; color: var(--secondary); margin-bottom: 24px; }
  .word { font-size: 262px; }
  .portrait .word { font-size: 300px; }
  .tagline {
    margin-top: 44px;
    max-width: 760px;
    font-size: 46px;
    line-height: 1.12;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--display);
  }
  .tagline em { font-family: "Newsreader", serif; font-weight: 400; color: var(--secondary); }
  .rule { height: 2px; background: var(--line); margin: 56px 0 32px; }
  .portrait .rule { margin-top: 88px; }
</style>
</head>
<body>
<div class="slide">
  <div class="topbar">
    <span class="mark"><span class="rec"></span>DoyaLabs</span>
    <span>01 / 05</span>
  </div>

  <div class="hero">
    <div class="intro serif">Introducing</div>
    <div class="dotmatrix word">DOYA<br>LABS<span class="pix"></span></div>
    <div class="tagline">A new studio making software that <em>feels like hardware.</em></div>
  </div>

  <div class="rule"></div>
  <div class="bottombar">
    <span>Swipe →</span>
    <span class="pager"><i class="on"></i><i></i><i></i><i></i><i></i></span>
  </div>
</div>
</body>
</html>
