<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DoyaLabs 02 What we make</title>
<script>if (location.hash === "#portrait") document.documentElement.classList.add("portrait");</script>
<link rel="stylesheet" href="slides.css">
<style>
  .head { margin-top: 64px; }
  .portrait .head { margin-top: 96px; }
  h1 {
    margin-top: 28px;
    font-size: 92px;
    line-height: 0.98;
    font-weight: 600;
    letter-spacing: -0.035em;
    color: var(--display);
  }
  .portrait h1 { font-size: 112px; }
  h1 em { font-family: "Newsreader", serif; font-weight: 400; letter-spacing: -0.01em; }
  .list { margin-top: auto; border-top: 2px solid var(--display); }
  .row {
    display: grid;
    grid-template-columns: 96px 1fr;
    align-items: baseline;
    padding: 26px 0;
    border-bottom: 2px solid var(--line2);
  }
  .portrait .row { padding: 36px 0; }
  .num { font-family: "GeistMono", monospace; font-weight: 500; font-size: 24px; color: var(--accent-text); letter-spacing: 0.08em; }
  .title { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; color: var(--display); }
  .desc { font-size: 28px; color: var(--secondary); margin-top: 6px; }
  .bottombar { margin-top: 40px; }
</style>
</head>
<body>
<div class="slide light">
  <div class="topbar">
    <span class="mark"><span class="rec"></span>DoyaLabs</span>
    <span>02 / 05</span>
  </div>

  <div class="head">
    <div class="eyebrow">What we make</div>
    <h1>Small apps with<br>the <em>soul of a gadget.</em></h1>
  </div>

  <div class="list">
    <div class="row">
      <span class="num">01</span>
      <div><div class="title">Offline first</div><div class="desc">Your files stay on your device. No account needed.</div></div>
    </div>
    <div class="row">
      <span class="num">02</span>
      <div><div class="title">Tactile by design</div><div class="desc">Dials, knobs and dot-matrix displays you want to touch.</div></div>
    </div>
    <div class="row">
      <span class="num">03</span>
      <div><div class="title">Quiet and fast</div><div class="desc">No clutter, no noise. Just the thing you came for.</div></div>
    </div>
  </div>

  <div class="bottombar">
    <span>doyalabs</span>
    <span class="pager"><i></i><i class="on"></i><i></i><i></i><i></i></span>
  </div>
</div>
</body>
</html>
