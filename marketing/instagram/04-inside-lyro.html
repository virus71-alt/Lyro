<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DoyaLabs 04 Inside Lyro</title>
<script>if (location.hash === "#portrait") document.documentElement.classList.add("portrait");</script>
<link rel="stylesheet" href="slides.css">
<style>
  .head { margin-top: 40px; }
  h1 {
    margin-top: 18px;
    font-size: 64px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--display);
  }
  .portrait .head { margin-top: 56px; }
  .portrait h1 { font-size: 66px; }
  h1 em { font-family: "Newsreader", serif; font-weight: 400; color: var(--secondary); letter-spacing: -0.01em; }

  /* Three phones: player in front, EQ and library tucked behind */
  .stage { flex: 1; position: relative; margin: 36px 0 28px; }
  .phone {
    --pw: 290px;
    position: absolute;
    bottom: 0;
    width: var(--pw);
    aspect-ratio: 1440 / 2975;
    padding: 9px;
    border-radius: 44px;
    background: #1a1a1a;
    box-shadow: 0 0 0 2px #2e2e2e, 0 30px 60px rgba(0, 0, 0, 0.7);
    box-sizing: content-box;
  }
  .phone img { display: block; width: 100%; height: 100%; border-radius: 36px; object-fit: cover; }
  .phone.mid { left: 50%; transform: translateX(-50%); z-index: 2; }
  .phone.side { --pw: 250px; bottom: 26px; opacity: 0.92; }
  .phone.l { left: 0; transform: rotate(-5deg); }
  .phone.r { right: 0; transform: rotate(5deg); }
  .portrait .phone { --pw: 360px; }
  .portrait .phone.side { --pw: 300px; bottom: 40px; }

  .label {
    position: absolute;
    top: calc(100% + 18px);
    left: 0; right: 0;
    text-align: center;
    font-family: "GeistMono", monospace;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--secondary);
  }
  .stage .phone { margin-bottom: 40px; }
</style>
</head>
<body>
<div class="slide">
  <div class="topbar">
    <span class="mark"><svg class="logo" viewBox="0 0 100 100" aria-label="DoyaLabs logo"><path d="M0,0 H50 A50,50 0 0 1 50,100 H0 Z M26,50 A22,22 0 1 0 70,50 A22,22 0 1 0 26,50 Z" fill="currentColor" fill-rule="evenodd"/><circle class="lens" cx="48" cy="50" r="11"/></svg>DoyaLabs</span>
    <span>04 / 05</span>
  </div>

  <div class="head">
    <div class="eyebrow">Inside Lyro</div>
    <h1>Every screen, <em>tuned by hand.</em></h1>
  </div>

  <div class="stage">
    <div class="phone side l"><img src="screenshots/08-equalizer.png" alt="Lyro equalizer"><div class="label">AutoEQ</div></div>
    <div class="phone side r"><img src="screenshots/05-folder-tracks.png" alt="Lyro library"><div class="label">Library</div></div>
    <div class="phone mid"><img src="screenshots/01-player.png" alt="Lyro player"><div class="label">Player</div></div>
  </div>

  <div class="bottombar">
    <span>Real screens</span>
    <span class="pager"><i></i><i></i><i></i><i class="on"></i><i></i></span>
  </div>
</div>
</body>
</html>
