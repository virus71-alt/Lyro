<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DoyaLabs Logo Board</title>
<style>
  @font-face { font-family: "GeistMono"; src: url("../../assets/fonts/GeistMono-Medium.ttf"); }
  @font-face { font-family: "Geist"; src: url("../../assets/fonts/Geist-SemiBold.ttf"); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1600px; background: #111; font-family: "Geist", sans-serif; color: #EDEDED; padding: 48px; }
  h2 { font-family: "GeistMono", monospace; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: #FF4438; margin: 0 0 18px; }
  h2 span { color: #8C8C8C; }
  .row { display: grid; grid-template-columns: 300px 300px 1fr; gap: 20px; margin-bottom: 20px; }
  .tile { border-radius: 24px; display: flex; align-items: center; justify-content: center; height: 300px; }
  .dark { background: #0A0A0A; box-shadow: inset 0 0 0 1px #262626; }
  .light { background: #F2F2F2; }
  .tile img { max-width: 72%; max-height: 72%; }
  .tile.icon img { max-width: 80%; max-height: 80%; }
  .wide img { max-width: 86%; max-height: 50%; }
  .stack { display: grid; gap: 20px; }
  .stack .tile { height: 140px; }
  .concept { margin-bottom: 44px; }
  .small { display: flex; gap: 28px; align-items: center; padding: 0 28px; justify-content: flex-start; }
  .small img { max-width: none; max-height: none; }
</style>
</head>
<body>
  <div class="concept">
    <h2>A · Pixel D <span>— dot-matrix D, red signal dot</span></h2>
    <div class="row">
      <div class="tile dark icon"><img src="svg/pixel-icon.svg"></div>
      <div class="tile light"><img src="svg/pixel-mark.svg"></div>
      <div class="stack">
        <div class="tile dark wide"><img src="svg/pixel-wordmark-dark.svg"></div>
        <div class="tile light small">
          <img src="svg/pixel-icon.svg" width="96"><img src="svg/pixel-icon.svg" width="48"><img src="svg/pixel-icon.svg" width="24">
          <img src="svg/pixel-wordmark.svg" height="40">
        </div>
      </div>
    </div>
  </div>

  <div class="concept">
    <h2>B · Signal D <span>— solid geometric D with a red lens</span></h2>
    <div class="row">
      <div class="tile dark icon"><img src="svg/signal-icon.svg"></div>
      <div class="tile light"><img src="svg/signal-mark.svg"></div>
      <div class="stack">
        <div class="tile dark wide"><img src="svg/signal-lockup-dark.svg"></div>
        <div class="tile light small">
          <img src="svg/signal-icon.svg" width="96"><img src="svg/signal-icon.svg" width="48"><img src="svg/signal-icon.svg" width="24">
          <img src="svg/signal-lockup.svg" height="44">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
